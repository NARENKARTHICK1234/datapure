services:
  # ── Backend: FastAPI + Pandas + Pandera ──────────────────────────────────
  - type: web
    name: datapure-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Set to your Render frontend URL after the Static Site is created:
      # e.g. https://datapure-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false          # fill in Render dashboard after deploy
      - key: PORT
        generateValue: false # Render injects this automatically

  # ── Frontend: React + Vite (Static Site) ─────────────────────────────────
  - type: web
    name: datapure-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Must be set to the Render backend URL after backend is deployed:
      # e.g. https://datapure-backend.onrender.com
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # SPA fallback — all unknown paths serve index.html (React Router)
      - type: rewrite
        source: /*
        destination: /index.html
